name: ارسال پست گیاهی هر ساعت

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_LINK: ${{ secrets.CHANNEL_LINK }}
        run: python bot.py

      - name: Save state (anti-duplicate)
        run: |
          if [ -f state.json ]; then
            git config user.name "herbal-bot"
            git config user.email "bot@users.noreply.github.com"
            git add state.json
            git diff --staged --quiet || git commit -m "chore: update sent posts state"
            git push
          else
            echo "state.json ساخته نشد (احتمالاً خارج از ساعت یا خطا)"
          fi
